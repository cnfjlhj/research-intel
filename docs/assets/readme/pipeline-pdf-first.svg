  </text>

  <path d="M782 340H886" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <path d="M862 320L896 340L862 360" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="910" y="250" width="250" height="180" rx="26" fill="#102A27" stroke="#22C55E" stroke-width="2"/>
  <text x="944" y="314" fill="#DCFCE7" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="34" font-weight="700">
    tmux session
  </text>
  <text x="944" y="362" fill="#BBF7D0" font-family="'SF Pro Text', 'Segoe UI', sans-serif" font-size="22">
    one session per paper
  </text>
  <text x="944" y="394" fill="#BBF7D0" font-family="'SF Pro Text', 'Segoe UI', sans-serif" font-size="22">
