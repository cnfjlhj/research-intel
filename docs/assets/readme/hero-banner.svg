    <rect x="-4" y="4" width="48" height="62" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="-8" y="0" width="48" height="62" rx="4" fill="#0f2340" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Lines on paper -->
    <line x1="0" y1="16" x2="28" y2="16" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="24" x2="22" y2="24" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="32" x2="32" y2="32" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
    <line x1="0" y1="40" x2="18" y2="40" stroke="#3b82f6" stroke-width="1.5" opacity="0.2"/>
    <!-- Pulse/signal -->
    <circle cx="52" cy="20" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <circle cx="52" cy="20" r="16" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
    <circle cx="52" cy="20" r="24" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.15"/>
