    <circle cx="200" cy="80" r="1" fill="#fff"/><circle cx="240" cy="80" r="1" fill="#fff"/>
    <circle cx="280" cy="80" r="1" fill="#fff"/><circle cx="320" cy="80" r="1" fill="#fff"/>
    <circle cx="360" cy="80" r="1" fill="#fff"/><circle cx="400" cy="80" r="1" fill="#fff"/>
