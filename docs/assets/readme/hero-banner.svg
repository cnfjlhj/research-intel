  <!-- Tagline -->
  <text x="440" y="126" text-anchor="middle"
        font-family="'Inter', 'SF Pro Text', -apple-system, 'Segoe UI', sans-serif"
        font-size="17" fill="#94a3b8">
    Self-hosted daily paper intelligence for researchers
  </text>

  <!-- Accent line -->
  <rect x="365" y="144" width="150" height="2.5" rx="1.25" fill="url(#accent)"/>

  <!-- Feature pills -->
  <g transform="translate(440, 175)" text-anchor="middle"
     font-family="'Inter', 'SF Pro Text', -apple-system, 'Segoe UI', sans-serif" font-size="12">
    <rect x="-218" y="-12" width="90" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="-173" y="4" fill="#cbd5e1">PDF-First</text>

    <rect x="-112" y="-12" width="100" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="-62" y="4" fill="#cbd5e1">arXiv + OR</text>

    <rect x="4" y="-12" width="88" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="48" y="4" fill="#cbd5e1">Telegram</text>

    <rect x="108" y="-12" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="163" y="4" fill="#cbd5e1">Self-Hosted</text>
