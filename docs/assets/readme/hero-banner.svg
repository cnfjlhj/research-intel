    <circle cx="200" cy="160" r="1" fill="#fff"/><circle cx="240" cy="160" r="1" fill="#fff"/>
    <circle cx="280" cy="160" r="1" fill="#fff"/><circle cx="320" cy="160" r="1" fill="#fff"/>
