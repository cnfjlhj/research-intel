    <circle cx="280" cy="120" r="1" fill="#fff"/><circle cx="320" cy="120" r="1" fill="#fff"/>
    <circle cx="360" cy="120" r="1" fill="#fff"/><circle cx="400" cy="120" r="1" fill="#fff"/>
