    <circle cx="790" cy="90" r="2" fill="#3b82f6"/>
    <circle cx="820" cy="50" r="2.5" fill="#3b82f6"/>
    <circle cx="770" cy="140" r="2" fill="#f59e0b"/>
    <circle cx="810" cy="170" r="3" fill="#f59e0b"/>
    <circle cx="840" cy="120" r="1.5" fill="#3b82f6"/>
    <line x1="750" y1="60" x2="790" y2="90" stroke="#3b82f6" stroke-width="0.8"/>
    <line x1="790" y1="90" x2="820" y2="50" stroke="#3b82f6" stroke-width="0.8"/>
    <line x1="790" y1="90" x2="770" y2="140" stroke="#3b82f6" stroke-width="0.8"/>
    <line x1="770" y1="140" x2="810" y2="170" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="820" y1="50" x2="840" y2="120" stroke="#3b82f6" stroke-width="0.8"/>
