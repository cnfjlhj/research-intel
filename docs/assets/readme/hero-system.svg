  </text>
  <rect x="1104" y="566" width="348" height="76" rx="18" fill="#172337"/>
  <text x="1132" y="614" fill="#F8FAFC" font-family="'SF Pro Text', 'Segoe UI', sans-serif" font-size="24" font-weight="600">
