  </text>
  <rect x="626" y="654" width="348" height="76" rx="18" fill="#172337"/>
  <text x="654" y="702" fill="#F8FAFC" font-family="'SF Pro Text', 'Segoe UI', sans-serif" font-size="24" font-weight="600">
