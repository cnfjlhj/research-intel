<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="920" rx="40" fill="#F6F1E7"/>
  <rect x="64" y="64" width="1472" height="792" rx="28" fill="#FFFDF8" stroke="#E2D9C8" stroke-width="2"/>
  <text x="104" y="144" fill="#172033" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="54" font-weight="700">
