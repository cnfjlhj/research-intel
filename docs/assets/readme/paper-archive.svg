  </text>

  <rect x="1172" y="576" width="260" height="122" rx="22" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="1202" y="630" fill="#172033" font-family="'SF Pro Text', 'Segoe UI', sans-serif" font-size="28" font-weight="600">
