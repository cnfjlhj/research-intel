  </text>
  <rect x="462" y="566" width="282" height="130" rx="22" fill="#EFFCF4" stroke="#8FD7A8"/>
  <text x="490" y="620" fill="#13633A" font-family="'SF Pro Text', 'Segoe UI', sans-serif" font-size="26" font-weight="600">
